<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Engineering Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Tech Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base Rounded Hex-Square Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="110" fill="url(#grid)"/>
  
  <!-- Outer Technical Blueprint Ring & Ticks -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Geometric Compass Arc & Caliper Guide -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.8"/>

  <!-- Core Engineering Symbol: Stylized Architectural "R" + Light Beam -->
  <!-- Vertical Pillar of 'R' with Engineering Dimension Notches -->
  <rect x="156" y="130" width="36" height="252" rx="10" fill="url(#goldGrad)"/>
  
  <!-- Notch lines along pillar -->
  <line x1="150" y1="170" x2="162" y2="170" stroke="#0f172a" stroke-width="3"/>
  <line x1="150" y1="210" x2="162" y2="210" stroke="#0f172a" stroke-width="3"/>
  <line x1="150" y1="250" x2="162" y2="250" stroke="#0f172a" stroke-width="3"/>
  <line x1="150" y1="290" x2="162" y2="290" stroke="#0f172a" stroke-width="3"/>
  <line x1="150" y1="330" x2="162" y2="330" stroke="#0f172a" stroke-width="3"/>

  <!-- Upper Loop of 'R' (Engineered Arc) -->
  <path d="M 188 130 H 280 C 330 130 358 158 358 200 C 358 242 330 270 280 270 H 188 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Diagonal Leg of 'R' (Dynamic Optical Light Beam) -->
  <path d="M 264 252 L 356 382" 
        fill="none" stroke="url(#goldGrad)" stroke-width="38" stroke-linecap="round"/>

  <!-- Precision Engineering Vertex / Optical Emitter Node -->
  <circle cx="280" cy="200" r="14" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="5"/>
  <circle cx="280" cy="200" r="5" fill="#38BDF8"/>

  <!-- Light Beam / Compass Pivot Point at Center Bottom -->
  <circle cx="356" cy="382" r="10" fill="url(#cyanGrad)"/>

  <!-- Drafting Caliper Ticks in Corners -->
  <path d="M 100 130 L 100 100 L 130 100" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.7"/>
  <path d="M 412 130 L 412 100 L 382 100" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.7"/>
  <path d="M 100 382 L 100 412 L 130 412" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.7"/>
  <path d="M 412 382 L 412 412 L 382 412" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.7"/>

  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>
</svg>
