<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Engineering Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Tech Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.4"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="100" fill="url(#grid)"/>
  <rect x="8" y="8" width="496" height="496" rx="94" fill="none" stroke="#F59E0B" stroke-width="5" stroke-opacity="0.85"/>
  
  <!-- Outer Blueprint Precision Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.75"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Glowing Core Aura -->
  <circle cx="256" cy="256" r="110" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>

  <!-- Architectural 'R' Pillar -->
  <rect x="176" y="146" width="36" height="225" rx="8" fill="url(#goldGrad)"/>
  
  <!-- Technical Calibration Notches -->
  <line x1="170" y1="185" x2="182" y2="185" stroke="#0f172a" stroke-width="3"/>
  <line x1="170" y1="225" x2="182" y2="225" stroke="#0f172a" stroke-width="3"/>
  <line x1="170" y1="265" x2="182" y2="265" stroke="#0f172a" stroke-width="3"/>
  <line x1="170" y1="305" x2="182" y2="305" stroke="#0f172a" stroke-width="3"/>
  <line x1="170" y1="345" x2="182" y2="345" stroke="#0f172a" stroke-width="3"/>

  <!-- Upper Loop of 'R' -->
  <path d="M 212 146 L 275 146 A 58 58 0 0 1 275 262 L 212 262 Z" fill="none" stroke="url(#goldGrad)" stroke-width="34" stroke-linejoin="round"/>

  <!-- Diagonal Engineering Leg of 'R' -->
  <polygon points="212,250 250,250 336,371 298,371" fill="url(#goldGrad)"/>

  <!-- Precision Luminaire Rays -->
  <g filter="url(#glow)">
    <line x1="316" y1="180" x2="355" y2="150" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="328" y1="195" x2="375" y2="180" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="324" y1="210" x2="368" y2="215" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="316" cy="195" r="7" fill="#FFFFFF"/>
  </g>
</svg>
